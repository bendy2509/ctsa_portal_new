server {
    listen 80;
    server_name rampe.bendyservilus.com;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/ctsa/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/ctsa/gunicorn.sock;
    }
}
