{# Composant confirm_modal : modale native <dialog> réutilisable pour toute action destructive. #}
<dialog id="ui-confirm-dialog" class="ui-dialog" closedby="any" aria-labelledby="ui-confirm-title">
  <div class="p-5 sm:p-6 space-y-4">
    <div class="space-y-1.5">
      <h2 id="ui-confirm-title" class="text-lg font-heading font-extrabold text-ctsa-slate m-0">
        Confirmer l'action
      </h2>
      <p id="ui-confirm-message" class="text-sm text-slate-600 m-0 leading-relaxed">
        Êtes-vous sûr de vouloir continuer ?
      </p>
    </div>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-2">
      <button type="button" data-confirm-cancel autofocus class="ui-btn ui-btn-secondary">
        Annuler
      </button>
      <form id="ui-confirm-form" method="post" action="">
        {% csrf_token %}
        <div id="ui-confirm-extra"></div>
        <button type="submit" id="ui-confirm-submit" data-submit-guard class="ui-btn ui-btn-danger w-full sm:w-auto">
          Supprimer
        </button>
      </form>
    </div>
  </div>
</dialog>
