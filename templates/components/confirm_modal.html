{# Composant confirm_modal : modale native <dialog> réutilisable pour toute action sensible. #}
<dialog id="ui-confirm-dialog"
        class="ui-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ui-confirm-title"
        aria-describedby="ui-confirm-message">
  <div class="ui-sheet-header">
    <h2 id="ui-confirm-title" class="text-lg font-heading font-semibold text-text m-0">
      Confirmer l’action
    </h2>
  </div>
  <div class="ui-sheet-body">
    <p id="ui-confirm-message" class="text-sm text-text-muted m-0 leading-relaxed">
      Êtes-vous sûr de vouloir continuer&nbsp;?
    </p>
  </div>
  <div class="ui-sheet-footer">
    <button type="button" data-confirm-cancel autofocus class="ui-btn ui-btn-secondary">
      Annuler
    </button>
    <form id="ui-confirm-form" method="post" action="">
      {% csrf_token %}
      <div id="ui-confirm-extra"></div>
      <button type="submit" id="ui-confirm-submit" data-submit-guard class="ui-btn ui-btn-danger w-full sm:w-auto">
        Supprimer
      </button>
    </form>
  </div>
</dialog>
