{# Composant card : section structurée par un filet supérieur de 1 px (Direction A, zéro ombre). #}
<section {% if id %}id="{{ id }}"{% endif %}
         {% if title_id %}aria-labelledby="{{ title_id }}"{% elif aria_label %}aria-label="{{ aria_label }}"{% endif %}
         class="bg-surface border-t border-border pt-4 {{ extra_class }}">
  {% if title %}
    <div class="pb-3 flex items-center justify-between gap-3">
      <div>
        <h2 {% if title_id %}id="{{ title_id }}"{% endif %} class="text-lg font-heading font-semibold text-text m-0">{{ title }}</h2>
      </div>
      {% if action_url and action_label %}
        <a href="{{ action_url }}" class="text-sm font-semibold text-primary hover:underline shrink-0">{{ action_label }}</a>
      {% endif %}
    </div>
  {% endif %}
  <div class="{{ body_class|default:'py-2' }}">
    {{ content }}
  </div>
</section>
