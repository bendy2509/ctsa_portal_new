{# Composant empty_state : état vide sobre en une phrase courte. #}
<div class="border-t border-b border-border py-10 text-center space-y-2">
  <p class="text-sm font-semibold text-text m-0">{{ title|default:"Aucun résultat." }}</p>
  {% if description %}
    <p class="text-sm text-text-muted m-0 max-w-md mx-auto">{{ description }}</p>
  {% endif %}
  {% if cta_url and cta_label %}
    <div class="pt-3">
      <a href="{{ cta_url }}" class="ui-btn ui-btn-secondary">{{ cta_label }}</a>
    </div>
  {% endif %}
</div>
