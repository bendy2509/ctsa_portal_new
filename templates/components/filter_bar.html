{# Composant filter_bar : recherche + filtres repliables + export secondaire. #}
<search>
  <form action="{{ action_url }}" method="get" class="py-3 border-b border-border space-y-3">
    {% if hidden_fields %}{{ hidden_fields }}{% endif %}
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex-1 min-w-[200px]">
        <label for="{{ search_id|default:'filter-q' }}" class="visually-hidden">{{ search_label|default:'Rechercher' }}</label>
        <input type="search"
               id="{{ search_id|default:'filter-q' }}"
               name="{{ search_name|default:'q' }}"
               value="{{ search_value }}"
               placeholder="{{ search_placeholder|default:'Rechercher…' }}"
               {% if is_container_search %}autocapitalize="characters" autocomplete="off"{% endif %}
               autocorrect="off"
               spellcheck="false"
               class="form-control w-full {% if is_container_search %}font-mono uppercase{% endif %}">
      </div>
      <button type="submit" class="ui-btn ui-btn-secondary shrink-0">
        <span>Filtrer</span>
      </button>
      {% if export_url %}
        <a href="{{ export_url }}" class="ui-btn ui-btn-secondary shrink-0" aria-label="{{ export_label|default:'Exporter' }}">
          <span>{{ export_label|default:'Exporter' }}</span>
        </a>
      {% endif %}
    </div>
    {% if extra_filters %}
      <details {% if filters_open %}open{% endif %}>
        <summary class="text-xs font-semibold text-text-muted cursor-pointer select-none py-1">
          Filtres avancés
        </summary>
        <div class="pt-2 grid grid-cols-1 sm:grid-cols-3 gap-3">
          {{ extra_filters }}
        </div>
      </details>
    {% endif %}
  </form>
</search>
