{# Composant form_section : regroupement de champs séparé par un filet de 1 px. #}
<fieldset class="border-t border-border pt-6 pb-2 m-0 border-x-0 border-b-0 space-y-4">
  {% if title %}
    <legend class="text-lg font-heading font-semibold text-text p-0">
      {{ title }}
    </legend>
  {% endif %}
  <div class="grid grid-cols-1 {{ grid_cols|default:'' }} gap-4">
    {{ fields }}
  </div>
</fieldset>
