{# Composant messages : notifications d’état sobres, sans icône décorative ni ombre. #}
{% for message in messages %}
  <div class="flex items-center justify-between gap-3 px-4 py-3 rounded border text-sm font-semibold
    {% if message.tags == 'error' %}bg-status-unavailable-bg border-status-unavailable-bd text-status-unavailable-fg
    {% elif message.tags == 'warning' %}bg-ctsa-surface border-border-ui text-status-pending-fg
    {% elif message.tags == 'success' %}bg-ctsa-surface border-border-ui text-success
    {% else %}bg-ctsa-surface border-border-ui text-text{% endif %}">
    <span>{{ message }}</span>
  </div>
{% endfor %}
