{# Composant data_table : enveloppe accessible pour tableaux desktop (filets de 1 px, sans boîte). #}
<div tabindex="0"
     role="region"
     aria-labelledby="{{ caption_id }}"
     class="table-wrapper">
  <table class="ctsa-table w-full">
    <caption id="{{ caption_id }}" class="visually-hidden">{{ caption }}</caption>
    {{ content }}
  </table>
</div>
